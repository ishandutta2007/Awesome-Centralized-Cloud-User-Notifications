<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".4"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-bell{0%,40%{transform:scale(1) rotate(0deg)}10%,30%{transform:scale(1.1) rotate(-10deg)}20%{transform:scale(1.1) rotate(10deg)}}@keyframes float-particle{0%{transform:translateY(0) opacity(.3)}50%{transform:translateY(-15px) opacity(.8)}}@keyframes signal-wave{0%{r:25px;opacity:.8}}@keyframes flow-line{0%{stroke-dashoffset:100}}.subtitle,.tag,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.tag{font-weight:600;font-size:13px;fill:#e2e8f0}.bell-icon{transform-origin:1050px 140px;animation:pulse-bell 4s infinite ease-in-out}.particle-1{animation:float-particle 5s infinite ease-in-out}.particle-2{animation:float-particle 7s infinite ease-in-out 1s}.wave{animation:signal-wave 2.5s infinite cubic-bezier(0,.2,.8,1);transform-origin:1050px 140px}</style><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><g stroke="#334155" stroke-width=".5" opacity=".3"><path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 12