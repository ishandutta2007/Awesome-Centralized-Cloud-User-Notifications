<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    /* Dynamic Animations */
    @keyframes pulse-bell {
      0%, 100% { transform: scale(1) rotate(0deg); }
      10% { transform: scale(1.1) rotate(-10deg); }
      20% { transform: scale(1.1) rotate(10deg); }
      30% { transform: scale(1.1) rotate(-10deg); }
      40% { transform: scale(1) rotate(0deg); }
    }
    
    @keyframes float-particle {
      0% { transform: translateY(0px) opacity(0.3); }
      50% { transform: translateY(-15px) opacity(0.8); }
      100% { transform: translateY(0px) opacity(0.3); }
    }

    @keyframes signal-wave {
      0% { r: 25px; opacity: 0.8; }
      100% { r: 65px; opacity: 0; }
    }

    @keyframes flow-line {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .bell-icon { transform-origin: 1050px 140px; animation: pulse-bell 4s infinite ease-in-out; }
    .particle-1 { animation: float-particle 5s infinite ease-in-out; }
    .particle-2 { animation: float-particle 7s infinite ease-in-out 1s; }
    .wave { animation: signal-wave 2.5s infinite cubic-bezier(0, 0.2, 0.8, 1); transform-origin: 1050px 140px; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Dynamic Background Decorative Spheres / Waves (Placed strictly behind text or to right) -->
  <circle cx="1050" cy="140" r="45" fill="none" stroke="#6366f1" stroke-width="2" class="wave" />
  <circle cx="1050" cy="140" r="55" fill="none" stroke="#8b5cf6" stroke-width="1.5" class="wave" style="animation-delay: 0.8s;" />

  <!-- Abstract Network Nodes / Dynamic Flow Graphic on Right side -->
  <g transform="translate(750, 180)" opacity="0.6">
    <line x1="50" y1="100" x2="150" y2="40" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="150" y1="40" x2="260" y2="100" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="50" y1="100" x2="260" y2="100" stroke="#ec4899" stroke-width="2"/>
    <line x1="150" y1="40" x2="180" y2="-40" stroke="#3b82f6" stroke-width="2"/>

    <circle cx="50" cy="100" r="8" fill="#6366f1" class="particle-1"/>
    <circle cx="150" cy="40" r="10" fill="#8b5cf6" class="particle-2"/>
    <circle cx="260" cy="100" r="7" fill="#ec4899" class="particle-1"/>
    <circle cx="180" cy="-40" r="9" fill="#3b82f6" class="particle-2"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 130)">
    <!-- Category Pill Header -->
    <g transform="translate(0, -50)">
      <rect width="280" height="32" rx="16" fill="url(#primary-grad)" opacity="0.2"/>
      <rect width="280" height="32" rx="16" fill="none" stroke="#8b5cf6" stroke-width="1"/>
      <text x="14" y="21" class="tag" fill="#a7f3d0">⚡ CENTRALIZED CLOUD NOTIFICATIONS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="25" class="title">
      Awesome Cloud User <tspan fill="url(#primary-grad)">Notifications</tspan> 📬
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="75" class="subtitle">
      Multi-Channel Messaging, Incident Alerting &amp; Notification Infrastructure
    </text>

    <!-- Key Feature Badges / Highlights -->
    <g transform="translate(0, 125)">
      <!-- Feature 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🚨 Incident Alerting</text>

      <!-- Feature 2 -->
      <rect x="175" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="191" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#a78bfa">📲 Multi-Channel API</text>

      <!-- Feature 3 -->
      <rect x="365" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="381" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#f472b6">🔓 Self-Hosted Engine</text>
    </g>
  </g>

  <!-- Big Decorative Bell Icon on Right -->
  <g class="bell-icon" transform="translate(1000, 90)">
    <circle cx="50" cy="50" r="45" fill="url(#primary-grad)" opacity="0.9" filter="url(#glow)"/>
    <path d="M50 22C41.7 22 35 28.7 35 37V48L30 53V56H70V53L65 48V37C65 28.7 58.3 22 50 22ZM44 59C44 62.3 46.7 65 50 65C53.3 65 56 62.3 56 59H44Z" fill="#ffffff"/>
  </g>
</svg>
